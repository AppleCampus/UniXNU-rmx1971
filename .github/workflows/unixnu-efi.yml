name: UniXNU payload volume

# Assembles the volume this board actually boots from: UniXNU.efi, DarwinBoot.efi, the
# prelinked kernel from the macOS kernel workflow, and the ADT UniXNU generates from
# dts/rmx1971.dts -- all in one FAT16 image the size of the vm-system partition.
#
# Why the assembly lives here and not in the kernel workflow: the kernel needs macOS and
# Xcode, but everything after it is platform independent. The two EFI binaries need EDK II,
# which builds fine on Linux, and the volume is written with mtools so it is byte-identical
# on every run. Splitting it this way keeps the expensive macOS job to the one step that
# actually requires a Mac.
#
# Volume layout (what U-Boot's EFI boot manager looks for):
#   \EFI\BOOT\BOOTAA64.EFI                UniXNU.efi    <- bootefi bootmgr finds this
#   \EFI\UniXNU\unixnu.toml               menu, kernel arguments, DarwinBoot driver
#   \EFI\UniXNU\Payloads\DarwinBoot.efi   the XNU loader
#   \EFI\UniXNU\Payloads\kernel.macho     prelinked kernel
#   \EFI\UniXNU\Payloads\kernel.macho.adt device tree for XNU
#
# The image is flashed with `fastboot flash vm-system rmx1971-payload.img`.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unixnu-efi.yml"
      - "board.toml"
      - "configs/**"
      - "dts/**"
      - "scripts/check-pe.py"
      - "scripts/make-uboot-payload.py"
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: UniXNU ref to build
        required: false
        default: "main"
      kernel_run_id:
        description: Kernel workflow run to take kernel.macho from (empty = newest successful one)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: device

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev python3 \
            clang lld llvm iasl nasm mtools dosfstools device-tree-compiler

      # EDK II's CLANGPDB toolchain prefixes every tool with CLANG_BIN and names
      # it without a version: $(CLANG_BIN)clang, $(CLANG_BIN)ld.lld,
      # $(CLANG_BIN)llvm-objcopy. Ubuntu installs clang and ld.lld unversioned
      # under /usr/bin but the LLVM utilities versioned, so build one directory
      # that has all of them under the plain names. Getting this wrong fails as
      # "/usr/local/bin/clang: not found" one module into the build.
      - name: One directory of unversioned LLVM tools
        run: |
          sudo mkdir -p /usr/local/bin
          link_tool() {
            dest="/usr/local/bin/$1"
            [ -e "$dest" ] && return 0
            src=$(command -v "$1" 2>/dev/null || true)
            [ -n "$src" ] || src=$(ls /usr/lib/llvm-*/bin/"$1" 2>/dev/null | head -1)
            if [ -n "$src" ]; then sudo ln -sf "$src" "$dest"; else echo "MISSING $1"; return 1; fi
          }
          for t in clang clang++ ld.lld lld lld-link llvm-ar llvm-lib llvm-objcopy \
                   llvm-rc llvm-size llvm-nm llvm-strip llvm-mt llvm-dlltool \
                   llvm-readobj llvm-objdump llvm-ranlib llvm-cxxfilt llvm-pdbutil; do
            link_tool "$t" || true
          done
          missing=0
          for t in clang ld.lld lld-link llvm-ar llvm-lib llvm-objcopy llvm-rc; do
            if [ -x "/usr/local/bin/$t" ]; then
              printf 'ok      %s\n' "$t"
            else
              printf 'MISSING %s\n' "$t"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { ls /usr/lib/llvm-*/bin | sort -u; exit 1; }
          /usr/local/bin/clang --version | head -1

      - name: Fetch UniXNU
        run: |
          git clone --depth 1 -b "${{ inputs.unixnu_ref || 'main' }}" \
            https://github.com/UniXNU/UniXNU unixnu-src
          git -C unixnu-src log --oneline -1

      # mu_basecore is the EDK II fork the project pins. release/202608 is what
      # package/build.sh names; fall back to the default branch so a renamed
      # branch degrades to "maybe newer" instead of failing the job.
      - name: Fetch edk2
        run: |
          if git clone --depth 1 -b release/202608 \
               https://github.com/microsoft/mu_basecore Mu_Basecore; then
            echo "edk2: release/202608"
          else
            rm -rf Mu_Basecore
            git clone --depth 1 https://github.com/microsoft/mu_basecore Mu_Basecore
            echo "edk2: default branch"
          fi
          cd Mu_Basecore
          git submodule update --init --depth 1 \
            MdePkg/Library/BaseFdtLib/libfdt \
            MdePkg/Library/MipiSysTLib/mipisyst \
            BaseTools/Source/C/BrotliCompress/brotli
          git log --oneline -1

      - name: Build UniXNU.efi
        env:
          UNIXNU_EDK2: ${{ github.workspace }}/Mu_Basecore
          CLANG_BIN: /usr/local/bin/
          JOBS: 4
        run: |
          bash unixnu-src/package/build.sh -b DEBUG -t CLANGPDB
          ls -l unixnu-src/package/Build/Out/AARCH64-DEBUG/
          python3 device/scripts/check-pe.py \
            unixnu-src/package/Build/Out/AARCH64-DEBUG/UniXNU.efi

      # DarwinBoot is the driver that actually starts XNU; without it the menu has an
      # entry it cannot boot. Its sources are this repository's drivers/DarwinBoot (a
      # submodule upstream), built against the same edk2 tree and the same CLANGPDB
      # toolchain, so the ELF/PE conventions match what UniXNU expects.
      - name: Build DarwinBoot.efi
        env:
          UNIXNU_EDK2: ${{ github.workspace }}/Mu_Basecore
          CLANG_BIN: /usr/local/bin/
        run: |
          set -euo pipefail
          export WORKSPACE="$PWD/device"
          export PACKAGES_PATH="$PWD/device/drivers/DarwinBoot:$PWD/unixnu-src/package:$PWD/Mu_Basecore"
          export EDK_TOOLS_PATH="$PWD/Mu_Basecore/BaseTools"
          export CONF_PATH="$PWD/unixnu-src/package/Build/Conf"
          export PYTHON_COMMAND=python3
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$EDK_TOOLS_PATH/Source/C/bin:$PATH"
          cd device
          build -p DarwinBootPkg/DarwinBoot.dsc -a AARCH64 -b DEBUG -t CLANGPDB -n 4
          efi=$(find Build -name 'DarwinBoot.efi' | head -1)
          ls -l "$efi"
          python3 scripts/check-pe.py "$efi"

      # The kernel is the one product that needs a Mac. Take it from the kernel
      # workflow instead of rebuilding it here.
      - name: Fetch the prelinked kernel
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.kernel_run_id }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if [ -z "${RUN_ID:-}" ]; then
            RUN_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/workflows/unixnu-kernel.yml/runs?status=success&per_page=1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
            echo "newest successful kernel run: $RUN_ID"
          fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/actions/runs/$RUN_ID/artifacts" -o artifacts.json
          aid=$(python3 - <<'PY'
          import json
          data = json.load(open('artifacts.json'))
          picks = [a for a in data.get('artifacts', []) if a['name'].startswith('rmx1971-xnu-')]
          if not picks:
              raise SystemExit('no rmx1971-xnu-* artifact in that run; the kernel step probably failed')
          picks.sort(key=lambda a: a['created_at'], reverse=True)
          print(picks[0]['id'])
          PY
          )
          echo "kernel artifact: $aid"
          curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/actions/artifacts/$aid/zip" -o kernel.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('kernel.zip')
          names = [n for n in z.namelist() if n.endswith('kernel.macho')]
          if not names:
              raise SystemExit(f'no kernel.macho in the artifact: {z.namelist()}')
          data = z.read(names[0])
          open('kernel.macho', 'wb').write(data)
          print('kernel.macho', len(data), 'bytes from', names[0], 'first bytes', data[:4])
          PY

      # Everything below is the platform independent half of "unixnu build payload": the
      # driver needs the device repository, the SoC feed and a prelinked kernel.
      - name: Build the payload volume
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: |
          set -euo pipefail
          cp kernel.macho "$RUNNER_TEMP/kernel.macho"
          cd unixnu-src
          ./unixnu fetch sdm710
          ./unixnu defconfig rmx1971_defconfig
          ./unixnu build payload --kernel "$RUNNER_TEMP/kernel.macho" \
            --edk2 "${{ github.workspace }}/Mu_Basecore"
          echo '--- payload report'
          cat out/*/*/*/payload/payload.json 2>/dev/null || true

      - name: Add the loader chain to the volume
        run: |
          set -euo pipefail
          payload=$(find unixnu-src/out -name payload.img | head -1)
          echo "payload image: $payload"
          python3 device/scripts/make-uboot-payload.py \
            --payload "$payload" \
            --unixnu-efi unixnu-src/package/Build/Out/AARCH64-DEBUG/UniXNU.efi \
            --darwinboot-efi "$(find device/Build -name DarwinBoot.efi | head -1)" \
            --output rmx1971-payload.img

      - name: Report
        run: |
          {
            echo '### payload volume'
            echo '```'
            sha256sum rmx1971-payload.img
            mdir -i rmx1971-payload.img -/ ::
            echo '```'
            echo 'flash with `fastboot flash vm-system rmx1971-payload.img`'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: rmx1971-payload
          if-no-files-found: error
          path: |
            rmx1971-payload.img
            unixnu-src/out/*/*/*/payload/payload.json
