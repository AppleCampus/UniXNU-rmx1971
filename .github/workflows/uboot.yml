name: U-Boot for rmx1971

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bison flex libssl-dev \
            libgnutls28-dev uuid-dev python3 python3-setuptools \
            device-tree-compiler

      - name: Fetch U-Boot (SDM710 branch)
        run: |
          git clone --depth 1 -b sirius/v2.0 https://github.com/57UU/u-boot uboot
          git -C uboot log --oneline -1

      - name: Overlay board files
        run: bash scripts/overlay.sh uboot

      - name: Build paint stub
        run: bash scripts/build-stub.sh out-stub

      - name: Build and pack
        run: bash scripts/build-in-tree.sh uboot out

      - name: Report
        run: |
          sha256sum out/boot.img out/boot-boarddtb.img out/boot-probe.img \
            out-stub/boot-stub.img out-stub/paint-fb.bin \
            out/stock-fb.bin \
            out/dts/upstream/src/arm64/qcom/sdm710-realme-rmx1971.dtb \
            out/u-boot-nodtb.bin > out/SHA256SUMS
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(CONFIG_EFI_LOADER|CONFIG_VIDEO_SIMPLE|CONFIG_SYS_CONSOLE_IS_IN_ENV|CONFIG_UFS_QCOM|CONFIG_DEFAULT_DEVICE_TREE)=" \
            out/.config >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### paint-fb' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,60p' out-stub/paint-fb.dis >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### arm64 Image header' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/report-header.py out/u-boot-nodtb.bin out-stub/paint-fb.bin >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: rmx1971-uboot
          include-hidden-files: true
          path: |
            out/boot.img
            out/boot-boarddtb.img
            out/boot-probe.img
            out/SHA256SUMS
            out/dts/upstream/src/arm64/qcom/sdm710-realme-rmx1971.dtb
            out/.config
            out-stub/boot-stub.img
            out-stub/paint-fb.bin
            out-stub/paint-fb.dis
